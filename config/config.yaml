# Binary-Hunter Configuration File

model:
  malconv:
    # MalConvGCT Model Hyperparameters
    channels: 256
    window_size: 256
    stride: 64
    embd_size: 8
    num_classes: 2

attack:
  # Adversarial Attack Settings
  padding_ratio: 0.01      # Padding length ratio relative to original file size (0.01 = 1%)
  iterations: 20            # Number of optimization iterations (T)

explainability:
  integrated_gradients:
    n_steps: 50             # Number of interpolation steps (higher = more accurate, slower)
    target_class: 1         # Target class for attribution (1 = Malware)
    baseline: "zero"        # Baseline type: "zero" (zero embedding vector)
    epsilon: 1e-7           # Numerical stability threshold for DeepLIFT Rescale Rule
    